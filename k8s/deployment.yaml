apiVersion: apps/v1
kind: Deployment

metadata:
  name: custom-nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: custom-nginx

  template:
    metadata:
      labels:
        app: custom-nginx

    spec:
      containers:
        - name: nginx
          image: my-nginx:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
